[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trustgate"
version = "1.3.0"
description = "Trust scoring for LLM-generated Python code: static checks, sandboxed tests, mutation analysis"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
trustgate = "trustgate.cli:main"

[tool.setuptools.packages.find]
include = ["trustgate*"]

[tool.setuptools.package-data]
trustgate = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
