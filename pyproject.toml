[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trustgate"
version = "1.5.0"
description = "Trust scoring for Python code with a generated-code defect profile: static checks, sandboxed tests, mutation analysis"
authors = [{ name = "Eva Iusupova" }]
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
trustgate = "trustgate.cli:main"

[tool.setuptools.packages.find]
include = ["trustgate*"]

[tool.setuptools.package-data]
trustgate = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
