name: trustgate

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read  # codeql-action/upload-sarif queries the workflow run
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./
        with:
          mode: scan
          changed: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          base: ${{ github.event.pull_request.base.sha || 'HEAD' }}
          project-tests: python -m pytest -q
          html: trustgate-report.html
          sarif: trustgate.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        # requires code scanning enabled in repo settings; SARIF is still
        # attached below as an artifact, so a missing feature must not fail CI
        continue-on-error: true
        with:
          sarif_file: trustgate.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trustgate-report
          path: |
            trustgate-report.html
            trustgate.sarif
            report.json
            summary.md
