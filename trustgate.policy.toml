# Пример строгой политики для CI/конкурсного демо.

saturation = 35

[thresholds]
pass = 85
block = 45

[penalties]
TG-D01 = 30
TG-D02 = 25
TG-D03 = 30
TG-D04 = 25
TG-D12 = 20

[dynamic]
first_fail = 20
next_fail = 5
fail_cap = 35
timeout = 20
build_error = 30

[mutation]
missing = 10
low = 25
mid = 12
low_bound = 0.4
mid_bound = 0.7

[policy]
fail_on_review = true
require_project_tests = true
require_project_mutation = true
max_findings = 0
max_critical_findings = 0

[roles.viewer]
permissions = ["read"]

[roles.reviewer]
permissions = ["read", "comment", "approve_review"]

[roles.maintainer]
permissions = ["read", "comment", "override_block", "manage_policy"]

[users.eva]
role = "maintainer"

[users.reviewer_demo]
role = "reviewer"
